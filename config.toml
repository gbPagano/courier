# Pipeline 1: kafka -> kafka
[[pipelines]]
name = "kafka->kafka"

[pipelines.source]
type = "kafka"
brokers = "localhost:9092"
group_id = "user-events-consumer"
topics = ["topic1"]

[[pipelines.sinks]]
type = "kafka"
brokers = "localhost:9092"
topic = "topic2"

# Pipeline 2: api polling -> kafka
[[pipelines]]
name = "api->kafka"

[pipelines.source]
type = "api_poll"
url = "https://jsonplaceholder.typicode.com/posts/1"
interval_secs = 3

[[pipelines.sinks]]
type = "kafka"
brokers = "localhost:9092"
topic = "topic1"

# Pipeline 3: api polling -> two kafka topics (auto-broadcast)
[[pipelines]]
name = "api->multi-kafka"
channel_capacity = 128

[pipelines.source]
type = "api_poll"
url = "https://jsonplaceholder.typicode.com/posts/1"
interval_secs = 5

[[pipelines.sinks]]
type = "kafka"
brokers = "localhost:9092"
topic = "topic3"

[[pipelines.sinks]]
type = "kafka"
brokers = "localhost:9092"
topic = "topic4"

# Pipeline 4: api polling -> scripted transform -> kafka
[[pipelines]]
name = "api->script->kafka"

[pipelines.source]
type = "api_poll"
url = "https://jsonplaceholder.typicode.com/posts/1"
interval_secs = 3

[[pipelines.transforms]]
type = "script"
runtime = "rhai"
entrypoint = "transform"
max_operations = 100000
script = """
fn transform(env) {
  if env.payload["userId"] == 1 {
    env.meta.headers["priority"] = "high";
  }

  if env.payload["id"] == 0 {
    return ();
  }

  env.payload["processed"] = true;
  env
}
"""

[[pipelines.sinks]]
type = "kafka"
brokers = "localhost:9092"
topic = "topic5"
