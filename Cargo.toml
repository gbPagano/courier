[package]
name = "data-courier"
version = "0.1.0-beta.4"
edition = "2024"
authors = ["gbPagano <guilhermebpagano@gmail.com>"]
license = "MPL-2.0"
description = "Async Rust framework for composable data pipelines"
documentation = "https://courier.gbpagano.dev/"
readme = "README.md"
homepage = "https://courier.gbpagano.dev/"
repository = "https://github.com/gbPagano/courier"
exclude = [
    "/.github/",
    "/docs/",
    "/examples/",
    "/CLAUDE.md",
    "/zensical.toml",
]

[lib]
name = "courier"
path = "src/lib.rs"

[[bin]]
name = "courier"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
clap = { version = "4.5.57", features = ["derive"] }
futures = "0.3.31"
log = "0.4.28"
mlua = { version = "0.11.3", features = ["lua54", "send", "serialize", "vendored"] }
rdkafka = { version = "0.38.0", features = ["cmake-build"] }
reqwest = { version = "0.12.23", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite", "json", "chrono"] }
rhai = { version = "1.24.0", features = ["serde", "sync"] }
thiserror = "2"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = "0.7.12"
toml = "0.9.8"
tracing = "0.1.41"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.32.0"
opentelemetry = { version = "0.31.0", features = ["metrics", "trace", "logs"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio", "metrics", "trace", "logs"] }
opentelemetry-otlp = { version = "0.31.1", default-features = false, features = ["grpc-tonic", "metrics", "trace", "logs"] }
opentelemetry-appender-tracing = "0.31.1"
object_store = { version = "0.13.2", features = ["fs", "aws"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
http-body-util = "0.1"
opentelemetry_sdk = { version = "0.31.0", features = ["testing"] }
tempfile = "3"
testcontainers-modules = { version = "0.15.0", features = ["kafka", "postgres"] }
tower = "0.5"
wiremock = "0.6.5"

[[bench]]
name = "transform_throughput"
harness = false

[[bench]]
name = "pipeline_scaling"
harness = false
