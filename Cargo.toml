[package]
name = "courier"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.5.57", features = ["derive"] }
env_logger = "0.11.8"
futures = "0.3.31"
log = "0.4.28"
mlua = { version = "0.11.3", features = ["lua54", "send", "serialize", "vendored"] }
rdkafka = { version = "0.38.0", features = ["cmake-build"] }
reqwest = { version = "0.12.23", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite", "json", "chrono"] }
rhai = { version = "1.24.0", features = ["serde", "sync"] }
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = "0.7.12"
toml = "0.9.8"

[dev-dependencies]
tempfile = "3"
testcontainers-modules = { version = "0.15.0", features = ["kafka", "postgres"] }
wiremock = "0.6.5"
