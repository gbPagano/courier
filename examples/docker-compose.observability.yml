# Local observability stack for Courier.
#
# Boots an OpenTelemetry Collector receiving OTLP from Courier, plus
# Prometheus, Tempo, Loki, and Grafana preconfigured to read from all
# three. Point Courier's `[observability]` block at `http://localhost:4317`:
#
#   [observability.metrics]
#   otlp_endpoint = "http://localhost:4317"
#
#   [observability.tracing]
#   otlp_endpoint = "http://localhost:4317"
#
#   [observability.logs]
#   otlp_endpoint = "http://localhost:4317"
#
# Then `docker compose -f examples/docker-compose.observability.yml up -d` and
# open Grafana at http://localhost:3000 (anonymous access enabled). Logs
# show up under Explore → Loki, with the same `service.name` resource
# attribute used by metrics and traces so they cross-correlate.
#
# Files referenced from this compose:
#   ./otel-collector.yaml          — Collector config
#   ./dashboards/courier.json      — bundled Grafana dashboard

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP/gRPC — point Courier here
      - "4318:4318"   # OTLP/HTTP
      - "9464:9464"   # Prometheus scrape endpoint
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=6h"
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"   # Tempo HTTP API (Grafana datasource)
    configs:
      - source: tempo_config
        target: /etc/tempo.yaml

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "3100:3100"   # Loki HTTP API + OTLP /otlp/v1/logs ingest
    configs:
      - source: loki_config
        target: /etc/loki/config.yaml

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./dashboards:/var/lib/grafana/dashboards:ro
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yaml
      - source: grafana_dashboards
        target: /etc/grafana/provisioning/dashboards/dashboards.yaml
    depends_on:
      - prometheus
      - tempo
      - loki

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: courier
          static_configs:
            - targets: ["otel-collector:9464"]

  tempo_config:
    content: |
      server:
        http_listen_port: 3200
      distributor:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
      ingester:
        trace_idle_period: 10s
        max_block_duration: 5m
      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/blocks
          wal:
            path: /var/tempo/wal

  # Single-binary Loki tuned for a local dev stack: in-process WAL,
  # filesystem chunk storage, no auth. The OTLP ingest endpoint
  # `/otlp/v1/logs` is enabled by default in Loki >= 3.0.
  loki_config:
    content: |
      auth_enabled: false
      server:
        http_listen_port: 3100
      common:
        path_prefix: /tmp/loki
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
        instance_addr: 127.0.0.1
      schema_config:
        configs:
          - from: 2024-01-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage_config:
        tsdb_shipper:
          active_index_directory: /tmp/loki/index
          cache_location: /tmp/loki/index_cache
        filesystem:
          directory: /tmp/loki/chunks
      limits_config:
        # Required so trace_id / span_id arrive on each log line as
        # structured metadata — that's what powers the Loki → Tempo
        # "view trace" jump in Grafana. Loki >= 3.0 promotes the
        # `service.name` resource attribute to an index label by default,
        # so no extra mapping is needed.
        allow_structured_metadata: true

  grafana_datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
        - name: Tempo
          type: tempo
          access: proxy
          url: http://tempo:3200
        - name: Loki
          type: loki
          access: proxy
          url: http://loki:3100

  grafana_dashboards:
    content: |
      apiVersion: 1
      providers:
        - name: Courier
          folder: Courier
          type: file
          allowUiUpdates: true
          options:
            path: /var/lib/grafana/dashboards
